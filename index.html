<script>
/* Set the theme before rendering to avoid a bright flash on dark devices. */
(function(){
  var preference = null;
  try { preference = localStorage.getItem('ghestyar_theme_v1'); } catch(e) {}
  var dark = preference === 'dark' || (preference !== 'light');
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#091229' : '#eef3ff');
})();
</script>

});

/* Ghestyar 2.2 — screenshot-driven mobile UX repairs */
.weekday-short{display:none}
/* The lists use their own dense, mobile-friendly toolbar. */
.obligations-page{min-width:0}
.ob-list-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 17px}
.ob-list-heading{min-width:0}
.ob-list-heading h2{font-size:20px;line-height:1.5;font-weight:900;margin:0 0 3px}
.ob-list-heading p{font-size:13px;font-weight:600;color:var(--muted);margin:0}
.ob-add-button{flex-shrink:0;white-space:nowrap;padding:11px 16px;min-height:45px}
.ob-list-tools{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.ob-list-tools .filters{display:flex;flex-wrap:nowrap;gap:7px;margin:0;min-width:0}
.ob-list-tools .filter{min-width:0;white-space:nowrap;border-radius:12px;min-height:42px;padding:9px 13px}
.ob-list-tools .searchbox{flex:0 1 320px;width:100%;max-width:none;min-width:165px;margin:0;min-height:46px;order:1;border-radius:13px}
.ob-list-tools .searchbox:focus-within{border-color:#9bcaf1;box-shadow:0 0 0 3px #85b9e41a}
.ob-list-tools .searchbox input{font-size:14px;min-height:44px;outline:0}
.ob-card{padding:18px;overflow:hidden}
.ob-top{min-width:0;gap:10px}
.ob-identity{flex:1;min-width:0}
.ob-card .tag{flex-shrink:0}
.ob-card .ob-name{font-size:16px;line-height:1.5}
.ob-card .ob-party{font-size:12px;line-height:1.55;margin-top:2px;display:flex;align-items:center;gap:6px;min-width:0}
.ob-card .ob-party .brand-mark{margin:0;vertical-align:middle}
.ob-finance{margin:16px 0 13px}
.ob-finance-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:700}
.ob-remaining-count{color:var(--teal);font-size:13px;font-weight:900;white-space:nowrap}
.ob-amount{display:flex;align-items:baseline;gap:7px;min-width:0;margin-top:4px;flex-wrap:wrap}
.ob-amount strong{font-size:clamp(19px,2.2vw,24px);line-height:1.6;font-weight:900;direction:ltr;unicode-bidi:isolate;white-space:nowrap;max-width:100%}

.ob-card .progress{height:7px}
.ob-card .ob-footer{font-size:12px;font-weight:700;margin-top:12px;gap:8px;min-width:0}
.ob-card .ob-footer span:first-child{min-width:0}
/* Calendar: eliminate full day-name collision on narrow screens. */
.weekgrid,.calgrid{width:100%;min-width:0;grid-template-columns:repeat(7,minmax(0,1fr))}
.weekgrid>span{min-width:0;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;font-weight:800}
.day{min-width:0;touch-action:manipulation}
.day:focus-visible{outline:3px solid #96c3e8;outline-offset:-2px}
.calendar-head>div:first-child{min-width:0}
.calendar-controls button{flex:0 0 auto}
@media(max-width:900px){
  .ob-list-tools{flex-wrap:wrap}
  .ob-list-tools .searchbox{flex:1 1 100%;order:1}
  .ob-list-tools .filters{width:100%;justify-content:flex-start;order:0}

@media(max-width:720px){

  .ob-list-tools .searchbox{width:100%;max-width:none;flex-basis:100%;padding-inline:13px;min-height:47px}

  .ob-card .ob-name{font-size:16px}
  .ob-card .tag{font-size:11px}

  .ob-amount strong{font-size:clamp(20px,5.65vw,25px)}
  .calendar-layout{gap:12px}

  .calendar-head{margin-bottom:16px;gap:7px}

  .calendar-controls{gap:4px}
  .calendar-controls button{width:35px;height:37px;border-radius:10px}

  .weekgrid,.calgrid{gap:4px}

  .weekday-full{display:none}

  .day{padding:6px 5px;min-height:clamp(46px,13vw,62px);border-radius:11px;align-items:flex-start}
  .day .number{font-size:14px!important}
  .day .dots{gap:2px}
  .mini-key{margin-top:14px;gap:12px;font-size:12px}
  .bottom-nav{padding-bottom:calc(8px + env(safe-area-inset-bottom));max-width:100vw}
  .bottom-nav button{min-width:0;touch-action:manipulation}

  /* Dashboard on phones: avoid repeating the entire obligations list. */
  .dash-v2 .dash-bottom-head,.dash-v2 .dash-small-grid{display:none}
  .dash-v2 .dash-footnote{margin-top:0}
}
@media(max-width:360px){
  .ob-list-heading h2{font-size:17px}

.report-swatch.actual{background:#59aeff}

.report-plot-label{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.report-breakdown{display:flex;flex-direction:column;gap:16px;margin-top:22px}

.report-table th{background:var(--canvas);font-weight:800;color:var(--muted)}
.report-table tr:last-child td{border-bottom:0}
.report-table td strong{font-weight:900}
.report-table .current{background:#97c6ec12}
.report-key{font-size:12px;color:var(--muted);line-height:1.95;padding:12px 15px;border:1px solid var(--border);border-radius:14px;background:var(--white)}

.report-mobile-months{display:none}
.report-month-card{border:1px solid var(--border);background:var(--canvas);border-radius:14px;padding:13px;min-width:0}

.report-month-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.report-month-meta>div{display:flex;flex-direction:column;gap:1px;min-width:0}

.report-payments{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.report-payment{padding:12px 14px;border:1px solid var(--border);background:var(--canvas);border-radius:13px;min-width:0}

.report-payment div{display:flex;align-items:center;justify-content:space-between;gap:7px;font-size:12px;color:var(--muted)}
.report-payment strong{font-weight:900;color:var(--ink)}
.report-empty{padding:26px 15px;text-align:center;color:var(--muted)}
.report-quick-link{display:flex;align-items:center;gap:8px;width:100%;justify-content:center;background:var(--white);border:1px solid var(--border);color:var(--ink);padding:12px;border-radius:12px;font-size:14px;font-weight:800;min-height:45px;margin-top:13px}

html[data-theme="dark"] .report-kpi.important .value{color:#e0eeff}

@media(max-width:720px){.report-toolbar{padding:12px}.report-toolbar-left,.report-toolbar-right{width:100%;justify-content:space-between}.report-toolbar-left .report-pills{flex:1;justify-content:space-around}.report-toolbar-left .report-pills button{flex:1;padding:8px 6px}.report-kpis{gap:9px}.report-kpi{padding:13px}.report-kpi .value{font-size:clamp(17px,5vw,22px)}.report-box{padding:14px}.report-box h2{font-size:16px}.report-plot{gap:4px}.report-bars{gap:3px;padding:3px;height:133px}.report-plot-label{font-size:10px}.report-payment h3{font-size:13px}.report-payments{grid-template-columns:1fr}.report-table{font-size:12px}.report-table th,.report-table td{padding:10px}}
@media(max-width:720px){
 .report-toolbar-left{flex-direction:column;align-items:stretch}

}

@media(max-width:370px){.report-toolbar-left{display:block}.report-toolbar-left .report-pills{margin-top:9px}.report-kpi .value{font-size:17px}.report-kpi .label{font-size:11px}.report-plot-label{font-size:9px}}

/* v3.5: accessible reminder center, own responsive layout, no mandatory push permission */
.reminder-panel{background:var(--white);border:1px solid var(--border);border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.reminder-page{display:grid;gap:16px;max-width:1050px;margin:0 auto 40px}
.reminder-hero{background:linear-gradient(115deg,#486b91,#7eafd8);color:#fff;padding:22px;border-radius:22px;display:flex;justify-content:space-between;gap:16px;align-items:center}
.reminder-hero h2{font-size:clamp(20px,3vw,29px);line-height:1.5;margin:0 0 8px;font-weight:900}
.reminder-hero p{font-size:13px;line-height:1.9;margin:0;opacity:.9}
.reminder-count{background:#ffffff22;border:1px solid #ffffff38;border-radius:16px;padding:12px 20px;text-align:center;flex-shrink:0}
.reminder-count strong{display:block;font-size:32px;line-height:1.3}
.reminder-count span{font-size:12px}
.reminder-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.reminder-tabs button{border:1px solid var(--border);border-radius:12px;padding:9px 15px;background:var(--soft);color:var(--ink);font-weight:800;min-height:44px}
.reminder-tabs button.active{background:#7daed7;border-color:#7daed7;color:white}
.reminder-section{display:grid;gap:10px}
.reminder-item{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--soft);border:1px solid var(--border);border-radius:15px;padding:15px}
.reminder-main{min-width:0;flex:1}
.reminder-main strong{display:block;font-size:15px;overflow-wrap:anywhere}
.reminder-meta{font-size:12px;color:var(--muted);margin:3px 0 0}
.reminder-level{font-size:12px;display:inline-block;font-weight:800;color:var(--teal);margin-bottom:3px}
.reminder-level.overdue{color:var(--rose)}
.reminder-amount{font-size:16px;font-weight:900;white-space:nowrap}
.reminder-amount small{font-size:11px;font-weight:600;color:var(--muted)}
.reminder-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.reminder-actions .btn{white-space:nowrap;min-height:40px;padding:8px 12px}
.reminder-empty{display:flex;flex-direction:column;gap:8px;align-items:center;padding:35px 10px;text-align:center;color:var(--muted)}
.reminder-empty svg{width:38px;height:38px;color:var(--green)}
.reminder-empty strong{font-size:17px;color:var(--ink)}
.reminder-settings{display:grid;gap:14px}
.reminder-setting-row{display:flex;align-items:center;justify-content:space-between;gap:14px}
.reminder-setting-row label{font-size:14px;font-weight:800;color:var(--ink)}
.reminder-setting-row p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.reminder-setting-row select{background:var(--white);color:var(--ink);border:1px solid var(--border);padding:10px 12px;border-radius:11px;min-width:135px;min-height:44px}
.reminder-toggle{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;min-height:44px;flex-shrink:0}
.reminder-toggle input{width:22px;height:22px;accent-color:#81b5df;cursor:pointer}
.reminder-note{background:var(--soft);border:1px solid var(--border);border-radius:12px;padding:11px 14px;font-size:12px;line-height:1.95;color:var(--muted)}
.reminder-info{font-size:12px;color:var(--muted);margin:0}
.reminder-alert-line{padding:14px 16px;border:1px solid #c6dbf441;background:var(--soft);border-radius:15px;margin:18px 0 6px;display:flex;justify-content:space-between;align-items:center;gap:9px}
.reminder-alert-line strong{font-size:13px;font-weight:850}
.reminder-alert-line .btn{font-size:12px;white-space:nowrap;min-height:40px}
.alert-bell{position:relative}
.alert-count{position:absolute;left:-5px;top:-7px;min-width:20px;height:20px;padding:0 3px;background:#ef667b;color:white;display:grid;place-items:center;font-size:10px;font-weight:900;border-radius:11px;border:2px solid var(--canvas);pointer-events:none}
html[data-theme="dark"] .reminder-tabs button.active{background:#90c4ee;border-color:#90c4ee}
html[data-theme="dark"] .reminder-hero{background:linear-gradient(120deg,#3e5d7f,#6285ab)}
@media(max-width:700px){
 .reminder-panel{padding:15px;border-radius:18px}
 .reminder-hero{padding:18px;align-items:flex-start}
 .reminder-count{padding:10px 13px}
 .reminder-count strong{font-size:26px}
 .reminder-item{flex-direction:column;align-items:stretch;padding:13px}
 .reminder-actions{justify-content:stretch;display:grid;grid-template-columns:1fr 1fr}
 .reminder-actions .btn{width:100%;font-size:12px;min-width:0;padding:9px 5px}
 .reminder-amount{margin-top:4px}
 .reminder-setting-row{align-items:flex-start}
 .reminder-alert-line{flex-direction:column;align-items:stretch}
}
@media(max-width:350px){.reminder-setting-row select{min-width:105px}.reminder-hero p{font-size:11px}.reminder-hero h2{font-size:19px}}


/* Ghestyar 3.6 — background Push activation */
.reminder-background-row{border:1px solid var(--border);border-radius:16px;padding:14px;margin:12px 0;background:var(--soft)}
.reminder-background-row label{font-size:15px;font-weight:850}
.reminder-background-row p{max-width:520px;overflow-wrap:anywhere}
.reminder-background-row button{min-width:145px}

/* 3.7: actionable status while cloud writes are pending or have failed. */
.sync-safety-banner{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--border);border-inline-start:4px solid var(--orange);background:var(--white);color:var(--ink);padding:12px 14px;border-radius:14px;margin-bottom:17px;line-height:1.8}
.sync-safety-banner>div{display:flex;flex-direction:column;gap:1px;min-width:0}

.sync-safety-banner .btn{flex-shrink:0;min-height:42px}
@media(max-width:390px){.sync-safety-banner{flex-direction:column;align-items:stretch}.sync-safety-banner .btn{width:100%}}

/* =========================================================
   Ghestyar 3.8 - Graphite & Lime visual system
   Inspired by the supplied finance-app reference.
   Presentation only: finances, cloud, and Push are unchanged.
   ========================================================= */
:root {
  --ink:#1b2638;--muted:#697587;--teal:#16416f;--teal2:#1f5b9b;
  --deep:#1b2939;--canvas:#f3f6f3;--white:#fff;--border:#e1e8e5;
  --soft:#edf3ec;--green:#204a77;--orange:#b77521;--rose:#c44e5a;
  --shadow:0 12px 34px rgba(24,40,53,.055);--radius:22px;
  --lime:#55b4ff;--accent-text:#131a23;
}
:root[data-theme="dark"] {
  color-scheme:dark;
  --ink:#f4f7ff;--muted:#b3bed0;--teal:#55b4ff;--teal2:#55b4ff;
  --deep:#8ccfff;--canvas:#0c1420;--white:#182232;--border:#303c4c;
  --soft:#222e3e;--green:#78c0ff;--orange:#ffc77b;--rose:#ff8798;
  --shadow:0 18px 34px rgba(1,7,15,.22);--lime:#4aa6ff;--accent-text:#111820;
}
html[data-theme="dark"],html[data-theme="dark"] body {background:#0c1420;color:var(--ink)}
body {background:var(--canvas);color:var(--ink);font-family:'Vazirmatn',Tahoma,Arial,sans-serif;}
html[data-theme="dark"] body {background:radial-gradient(ellipse at 85% -30%,#1a2b3d 0,transparent 53%),#0c1420}
html[data-theme="dark"] .brand h1,html[data-theme="dark"] .page-title,
html[data-theme="dark"] .section-heading h2,html[data-theme="dark"] .dash-panel .panel-head h3,
html[data-theme="dark"] .dash-bottom-head h2,html[data-theme="dark"] .panel-head h3 {color:var(--ink)}
html[data-theme="dark"] .brand span,html[data-theme="dark"] .page-kicker,html[data-theme="dark"] .nav-label {color:var(--muted)}
.main {max-width:1540px;padding-top:30px}
.topbar {margin-bottom:24px}
.page-kicker {color:var(--muted);font-weight:700}
.page-title {font-size:clamp(23px,2.5vw,29px);letter-spacing:-.3px;color:var(--ink)}
.sidebar,html[data-theme="dark"] .sidebar {background:var(--white);border-left:1px solid var(--border);box-shadow:none}
.sidebar {width:250px;padding:29px 17px 20px}
.main {width:calc(100% - 250px)}
.brand {padding-bottom:24px}

.sidebar-box button,html[data-theme="dark"] .sidebar-box button {background:var(--white);border:1px solid var(--border);color:var(--teal)}
.demo-note,html[data-theme="dark"] .demo-note {color:var(--muted)}
.icon-btn,.pill-btn,.account-trigger,.theme-toggle,html[data-theme="dark"] .icon-btn,html[data-theme="dark"] .pill-btn,html[data-theme="dark"] .account-trigger {background:var(--white);border:1px solid var(--border);color:var(--ink);border-radius:16px;box-shadow:none}
.account-trigger.signed-out,html[data-theme="dark"] .account-trigger.signed-out {background:var(--soft);color:var(--ink);border-color:var(--border)}

.btn,.pill-btn,.icon-btn {border-radius:14px}
.btn.primary,html[data-theme="dark"] .btn.primary {background:var(--lime);border-color:var(--lime);color:var(--accent-text);box-shadow:0 8px 22px #4aa8f519;font-weight:900}
.btn.primary:hover,html[data-theme="dark"] .btn.primary:hover {background:#82c8ff;border-color:#82c8ff;color:var(--accent-text)}
.btn.subtle,html[data-theme="dark"] .btn.subtle {background:var(--soft);border-color:var(--border);color:var(--teal)}

.panel,.stat,.ob-card,.dash-panel,.metric-bento,.detail-banner,.modal,.list-table,
html[data-theme="dark"] .panel,html[data-theme="dark"] .stat,html[data-theme="dark"] .ob-card,
html[data-theme="dark"] .dash-panel,html[data-theme="dark"] .metric-bento,
html[data-theme="dark"] .detail-banner,html[data-theme="dark"] .modal,html[data-theme="dark"] .list-table {

/* Reference-like balance card */
.dash-v2 {gap:19px}
.dash-v2 .hero-bento {grid-template-columns:minmax(0,1.2fr) minmax(300px,.82fr);gap:15px}
.month-card,html[data-theme="dark"] .month-card {
 background:linear-gradient(135deg,#263344 0%,#202c3d 58%,#1b2736 100%);color:#f7faff;
 border:1px solid #3b4858;border-radius:27px;padding:27px 29px 25px;min-height:318px;
 box-shadow:0 15px 31px #050b142b;position:relative;isolation:isolate

/* === قسط‌یار ۳.۹: unified graphite/lime visual language, Persian-first UX === */

/* 3.9.1 — Mobile install sheet, isolated from finance/sync styles. */
#gh-install-root[hidden]{display:none!important}
#gh-install-root{position:fixed;inset:0;z-index:3000;display:flex;justify-content:center;align-items:flex-end;font-family:Vazirmatn,Tahoma,sans-serif;direction:rtl}
.gh-install-dim{position:absolute;inset:0;background:rgba(3,8,16,.74);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.gh-install-sheet{position:relative;width:min(100%,480px);padding:23px 22px calc(23px + env(safe-area-inset-bottom,0px));border-radius:28px 28px 0 0;border:1px solid #41516a;background:linear-gradient(155deg,#1b283b,#101b2b);color:#f2f6fa;box-shadow:0 20px 70px #0008;max-height:min(90dvh,760px);overflow-y:auto;overscroll-behavior:contain;animation:gh-install-up .23s ease-out}
.gh-install-sheet:focus{outline:none}
.gh-install-sheet:before{content:"";position:absolute;top:10px;left:calc(50% - 21px);width:42px;height:4px;border-radius:999px;background:#7c8a9e70}
.gh-install-close{position:absolute;top:26px;left:20px;display:grid;place-items:center;width:44px;height:44px;border:1px solid #425269;background:#26344a;color:#e8edf4;border-radius:14px;font-size:25px;line-height:1;cursor:pointer}
.gh-install-brand{display:flex;align-items:center;gap:14px;margin:8px 0 19px;padding-left:48px}
.gh-install-mark{width:66px;height:66px;border-radius:19px;border:1px solid #385370;background:#212e3e;display:grid;place-items:center;color:#53b8ff;flex-shrink:0}.gh-install-mark svg{width:35px;height:35px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gh-install-brand strong{display:block;font-size:21px;font-weight:900;line-height:1.5;color:#fff}
.gh-install-brand span{font-size:12px;color:#aebed0}
.gh-install-caption{font-size:13px;color:#c4cfdf;line-height:2;margin:0 0 20px}
.gh-install-features{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 20px}
.gh-install-feature{display:flex;align-items:center;gap:8px;background:#25354b;border:1px solid #3b4b62;border-radius:13px;padding:10px 12px;font-size:12px;color:#e8eef6}
.gh-install-feature span{color:#53b8ff;font-weight:900;font-size:18px}
.gh-install-primary,.gh-install-secondary{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border-radius:16px;cursor:pointer;font-family:inherit;font-weight:850;font-size:15px;transition:filter .18s}
.gh-install-primary{border:0;background:#53b8ff;color:#0a1523}
.gh-install-primary:hover{filter:brightness(1.06)}
.gh-install-secondary{border:1px solid #45556b;background:transparent;color:#d4dce8;margin-top:10px}
.gh-install-note{margin:13px 0 0;font-size:11px;line-height:1.9;color:#9dafc2;text-align:center}
.gh-install-steps{display:grid;gap:9px;margin:0 0 20px;padding:0;list-style:none;counter-reset:gh-install-step}
.gh-install-steps li{counter-increment:gh-install-step;display:flex;align-items:center;gap:11px;border:1px solid #3a4d62;background:#26354a;border-radius:14px;padding:11px 13px;font-size:13px;line-height:1.8;color:#eef3fb}
.gh-install-steps li:before{content:counter(gh-install-step);flex-shrink:0;display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:#53b8ff;color:#0b1726;font-size:14px;font-weight:900}
.gh-install-close:focus-visible,.gh-install-primary:focus-visible,.gh-install-secondary:focus-visible{outline:3px solid #9dd3ff;outline-offset:3px}
@keyframes gh-install-up{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
@media(min-width:650px){#gh-install-root{align-items:center;padding:20px}.gh-install-sheet{border-radius:26px;padding-bottom:24px}}
@media(max-width:370px){.gh-install-sheet{padding-right:16px;padding-left:16px}.gh-install-features{grid-template-columns:1fr}.gh-install-brand strong{font-size:19px}}
@media(prefers-reduced-motion:reduce){.gh-install-sheet{animation:none}}

const jfmt=new Intl.DateTimeFormat('en-US-u-ca-persian',{year:'numeric',month:'numeric',day:'numeric',timeZone:'UTC'});
const jmonths=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const asISO=date=>date.toISOString().slice(0,10);
const parseISO=iso=>new Date(iso+'T12:00:00.000Z');
function jalali(date){const parts=jfmt.formatToParts(date instanceof Date?date:parseISO(date));const d={};for(const p of parts){if(p.type==='year')d.y=+p.value;if(p.type==='month')d.m=+p.value;if(p.type==='day')d.d=+p.value;}return d;}
function jText(iso,full=false){if(!iso)return '—';const d=jalali(iso);return full?`${fnum(d.y)}/${fnum(String(d.m).padStart(2,'0'))}/${fnum(String(d.d).padStart(2,'0'))}`:`${fnum(d.d)} ${jmonths[d.m-1]}`;}
const yCache=new Map();
function yearIndex(y){if(yCache.has(y))return yCache.get(y);const map=new Map();let t=Date.UTC(y+621,0,1);const end=Date.UTC(y+622,5,30);for(;t<end;t+=86400000){const date=new Date(t);const j=jalali(date);if(j.y===y)map.set(`${j.m}/${j.d}`,date.toISOString().slice(0,10));}yCache.set(y,map);return map;}
function jISO(y,m,d){return yearIndex(y).get(`${m}/${d}`)||null;}
function jParse(value){const a=String(value||'').replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).split(/[\/\-.]/).map(Number);return a.length===3&&a.every(Number.isInteger)?jISO(a[0],a[1],a[2]):null;}
function addJMonth(start,offset,day){const j=typeof start==='string'?jalali(start):start;const ind=j.y*12+j.m-1+offset;const y=Math.floor(ind/12),m=(ind%12+12)%12+1;for(let d=day||j.d;d>=1;d--){const iso=jISO(y,m,d);if(iso)return iso;}return null;}
function currentLocalISO(){const n=new Date();return [n.getFullYear(),String(n.getMonth()+1).padStart(2,'0'),String(n.getDate()).padStart(2,'0')].join('-');}
let todayISO=currentLocalISO(),todayJ=jalali(todayISO);
const id=()=>((typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():'id'+Date.now()+Math.random().toString(16).slice(2));
function makeInstallments(total,n,start,rate=0,kind='interest'){
 if(!Number.isSafeInteger(total)||total<=0||!Number.isInteger(n)||n<1||n>120||!Number.isFinite(rate)||rate<0||rate>100||!start)return [];
 const dates=Array.from({length:n},(_,i)=>addJMonth(start,i));if(dates.some(v=>!v))return [];
 let amounts=[];
 if(kind==='qard'&&rate>0){
  // Annual service fee on outstanding principal, allocated to first month of each service year.
  // Actual bank contracts differ: this is a transparent estimate that users can edit.
  const feeSlots=Array.from({length:n},(_,i)=>i).filter(i=>i%12===0);
  const principalSlots=n-feeSlots.length;
  if(principalSlots===0){amounts=[total+Math.round(total*rate/100*n/12)];}
  else {
   const base=Math.floor(total/principalSlots),remainder=total-base*principalSlots;
   let bal=total,pi=0;
   amounts=Array.from({length:n},(_,i)=>{
    if(i%12===0){const remaining=Math.min(12,n-i);return Math.max(1,Math.round(bal*rate/100*remaining/12));}
    const v=base+(pi===principalSlots-1?remainder:0);bal-=v;pi++;return v;
   });
  }
 }else{
  const r=rate/1200;
  const raw=r>0?total*r/(1-Math.pow(1+r,-n)):total/n;
  let balance=total;
  amounts=Array.from({length:n},(_,i)=>{
   const interest=Math.round(balance*r);
   const payment=i===n-1?balance+interest:Math.min(balance+interest,Math.max(1,Math.round(raw)));
   balance=Math.max(0,balance-(payment-interest));return payment;
  });
 }
 if(amounts.some(v=>!Number.isSafeInteger(v)||v<=0||v>1e12))return [];
 return amounts.map((amount,i)=>({id:id(),number:i+1,amount,due:dates[i]}));
}
// 3.2: real first-run empty state, with non-destructive legacy demo cleanup.
const KEY='ghestyar_v1_demo';
const LEGACY_SAMPLE_ARCHIVE='ghestyar_legacy_seeded_backup_v1';
const LEGACY_RESTORE_KEEP='ghestyar_legacy_restore_requested_v1';
let data=[];let storageAvailable=true;let storageRecoveryNeeded=false;
function isExactLegacySampleOnly(items){
 // Never remove custom or cloud data. Only the exact three auto-generated old demo files qualify.
 if(!Array.isArray(items)||items.length!==3)return false;
 const specs={
  'وام بانک ملت':{type:'loan',party:'بانک ملت',principal:180000000,n:18,paid:6,total:216000000},
  'خرید لپ‌تاپ':{type:'purchase',party:'فروشگاه دیجیتال',principal:36000000,n:6,paid:2,total:36000000},
  'قرض شخصی':{type:'other',party:'دوست',principal:15000000,n:5,paid:1,total:15000000}
 };
 const titles=new Set();
 return items.every(o=>{
  const spec=specs[o.title];if(!spec||titles.has(o.title))return false;titles.add(o.title);
  if(o.type!==spec.type||o.party!==spec.party||o.mode!=='manual'||o.principal!==spec.principal||o.rate!==0||o.installments.length!==spec.n||o.payments.length!==spec.paid||(o.changes||[]).length>0)return false;
  if(o.installments.reduce((sum,i)=>sum+i.amount,0)!==spec.total)return false;
  if(o.installments.some((i,k)=>i.number!==k+1))return false;
  return o.payments.every((payment,k)=>payment.note==='پرداخت نمونه'&&!payment.reversedAt&&payment.installmentId===o.installments[k].id&&payment.date===o.installments[k].due&&payment.amount===(o.title==='قرض شخصی'?3000000:o.installments[k].amount));
 });
}
function loadLocalData(){
 try{
  const raw=localStorage.getItem(KEY);
  if(!raw){storageRecoveryNeeded=false;storageAvailable=true;return [];}
  const entries=validateBackup(JSON.parse(raw));
  if(isExactLegacySampleOnly(entries)&&localStorage.getItem(LEGACY_RESTORE_KEEP)!=='yes'){
   // Archive first: never discard existing stored bytes without a recoverable copy.
   if(!localStorage.getItem(LEGACY_SAMPLE_ARCHIVE))localStorage.setItem(LEGACY_SAMPLE_ARCHIVE,raw);
   localStorage.removeItem(KEY);
   storageRecoveryNeeded=false;storageAvailable=true;
   return [];
  }
  storageRecoveryNeeded=false;storageAvailable=true;
  return entries;
 }catch(e){
  storageAvailable=false;storageRecoveryNeeded=true;
  console.error('Stored data is inaccessible or invalid; preventing overwrite:',e.message);
  return [];
 }
}
data=loadLocalData();
function commit(next){
 if(cloud.user){
   if(cloudCacheChanged()){showCacheConflict();return false;}
   if(!['ready','pending','error'].includes(cloud.phase)){toast('تا پایان بارگذاری یا حل تعارض، ثبت تغییرات ممکن نیست.','error');return false;}
   try{const validated=validateBackup({version:1,obligations:next});
     const record=JSON.stringify({baseRevision:cloud.revision,dirty:true,obligations:validated});
     localStorage.setItem(cloudCacheKey(),record);cloudCacheFingerprint=record;data=validated;cloud.dirty=true;cloud.phase='pending';
     queueMicrotask(()=>pushCloud());return true;
   }catch(e){toast('ذخیره محلی پیش از ارسال ابری ناموفق بود: '+e.message,'error');return false;}
 }
 try{localStorage.setItem(KEY,JSON.stringify({version:1,obligations:next}));data=next;storageAvailable=true;return true;}
 catch(e){storageAvailable=false;toast('ذخیره در این مرورگر ناموفق بود. فضای ذخیره را بررسی کن.','error');return false;}
}
function save(){return commit(data);}
const state={datePicker:null,providerOpen:false,providerQuery:'',reminderFilter:'all',page:(location.hash==='#reminders'?'reminders':'dashboard'),reportType:'all',reportSpan:6,reportOffset:0,dashFilter:'all',hideAmounts:false,filter:'active',query:'',selectedId:null,detailTab:'schedule',scheduleFilter:'open',edit:null,deleteTarget:null,settleTarget:null,financeAuditOpen:false,restoreCandidate:null,calendarMonth:{y:todayJ.y,m:todayJ.m},selectedDay:todayISO,payment:null,wizardStep:1,draft:null};
function total(o){return o.installments.reduce((s,x)=>s+x.amount,0)}
function paid(o,installmentId){return o.payments.filter(p=>p.installmentId===installmentId&&!p.reversedAt).reduce((s,x)=>s+x.amount,0)}
function left(o,inst){return Math.max(0,inst.amount-paid(o,inst.id))}
function outstanding(o){return o.installments.reduce((s,i)=>s+left(o,i),0)}
function paidTotal(o){return total(o)-outstanding(o)}
/* 4.3 — safe financial invariants and contract-schedule early payments. */
function remainingInstallments(o){return o.installments.map(i=>({i,amount:left(o,i)})).filter(x=>x.amount>0).sort((a,b)=>a.i.due.localeCompare(b.i.due)||a.i.number-b.i.number);}
function bulkPaymentSummary(o){
 const rows=remainingInstallments(o);
 const amount=rows.reduce((sum,x)=>sum+x.amount,0);
 const future=rows.filter(x=>x.i.due>todayISO);
 return {rows,amount,futureCount:future.length,futureAmount:future.reduce((sum,x)=>sum+x.amount,0)};
}
function financialAudit(){
 let scheduled=0,received=0,remaining=0,activePayments=0,reversedPayments=0,installmentCount=0;
 const issues=[];
 for(const o of data){
  const perInst=new Map(o.installments.map(i=>[i.id,0]));
  for(const p of o.payments){
   if(p.reversedAt){reversedPayments++;continue;}

function reportMonthKey(iso){const j=jalali(iso);return j.y*12+j.m-1;}
function reportCurrentKey(){return todayJ.y*12+todayJ.m-1;}
function reportLabel(key){const y=Math.floor(key/12),m=(key%12+12)%12+1;return `${jmonths[m-1]} ${fnum(y)}`;}
function reportShortLabel(key){return jmonths[(key%12+12)%12];}
/* 4.5.0 — cash-flow forecast based only on unpaid contractual installments.
   Prior-month arrears are rolled into the current month's immediate cash need.
   No forecast values are persisted and no income/expense assumptions are invented. */
function cashflowForecast(span=6){
 // Keep the horizon bounded and integral; this model is read-only and never persisted.

 const byKey=new Map(rows.map(row=>[row.key,row]));
 let overdueAmount=0,overdueCount=0;
 for(const o of data){
  // Aggregate valid, non-reversed payments once per obligation (O(payments + installments)).
  const paidByInstallment=new Map();
  for(const payment of o.payments){
   if(payment.reversedAt)continue;
   paidByInstallment.set(payment.installmentId,(paidByInstallment.get(payment.installmentId)||0)+payment.amount);
  }
  for(const inst of o.installments){
   const key=reportMonthKey(inst.due);
   if(key>=current+span)continue;
   const target=byKey.get(key<current?current:key);
   if(!target)continue;
   const remaining=Math.max(0,inst.amount-(paidByInstallment.get(inst.id)||0));
   if(!Number.isSafeInteger(remaining)||remaining<=0)continue;
   target.amount+=remaining;
   target.count++;
   target.obligations.add(o.id);
   if(inst.due<todayISO){target.overdueAmount+=remaining;overdueAmount+=remaining;overdueCount++;}
  }
 }
 const normalized=rows.map(row=>({...row,obligationsCount:row.obligations.size}));
 const total=normalized.reduce((sum,row)=>sum+row.amount,0);
 const peak=normalized.reduce((best,row)=>row.amount>(best?.amount||0)?row:best,null);
 return {rows:normalized,total,peak:peak?.amount>0?peak:null,installments:normalized.reduce((sum,row)=>sum+row.count,0),overdueAmount,overdueCount};
}

function reportData(){
 const obligations=state.reportType==='all'?data:data.filter(o=>o.type===state.reportType);
 const current=reportCurrentKey(),start=current+state.reportOffset;
 const rows=Array.from({length:state.reportSpan},(_,i)=>({key:start+i,label:reportLabel(start+i),short:reportShortLabel(start+i),scheduled:0,received:0,remaining:0,count:0}));
 const byKey=new Map(rows.map(r=>[r.key,r]));
 let remainingTotal=0,overdue=0,overdueCount=0;
 for(const o of obligations){
  for(const inst of o.installments){
   const rem=left(o,inst);remainingTotal+=rem;
   if(rem>0&&inst.due<todayISO){overdue+=rem;overdueCount++;}
   const r=byKey.get(reportMonthKey(inst.due));
   if(r){r.scheduled+=inst.amount;r.remaining+=rem;r.count++;}
  }
  for(const p of o.payments){
   if(p.reversedAt)continue;
   const r=byKey.get(reportMonthKey(p.date));
   if(r)r.received+=p.amount;
  }
 }
 const paidThisMonth=obligations.reduce((sum,o)=>sum+o.payments.filter(p=>!p.reversedAt&&reportMonthKey(p.date)===current).reduce((v,p)=>v+p.amount,0),0);
 const monthDue=obligations.reduce((sum,o)=>sum+o.installments.filter(i=>reportMonthKey(i.due)===current).reduce((v,i)=>v+left(o,i),0),0);
 const byType=['loan','purchase','other'].map(type=>({type,label:types[type].label,total:obligations.filter(o=>o.type===type).reduce((sum,o)=>sum+outstanding(o),0)}));
 const recent=obligations.flatMap(o=>o.payments.filter(p=>!p.reversedAt).map(p=>({o,p}))).sort((a,b)=>b.p.date.localeCompare(a.p.date)).slice(0,6);
 return {rows,remainingTotal,overdue,overdueCount,paidThisMonth,monthDue,byType,recent,obligations};
}

function validISO(s){if(typeof s!=='string'||!/^(19|20|21)\d{2}-\d{2}-\d{2}$/.test(s))return false;const d=new Date(s+'T12:00:00Z');return !Number.isNaN(d.getTime())&&d.toISOString().slice(0,10)===s;}
function validateBackup(parsed){

 if(parsed.obligations.length>1000)throw Error('تعداد تعهدات بیش از حد مجاز است.');
 const validId=s=>typeof s==='string'&&/^[a-zA-Z0-9_-]{1,110}$/.test(s);

  ids.add(o.id);totalRows+=o.installments.length;if(totalRows>10000)throw Error('تعداد اقساط بیش از حد مجاز است.');
  const instIds=new Map();
  const installments=o.installments.map((i,idx)=>{if(!i||!validId(i.id)||ids.has(i.id)||i.number!==idx+1||!safeAmount(i.amount)||!validISO(i.due))throw Error('شماره، مبلغ یا تاریخ یکی از اقساط نامعتبر است.');ids.add(i.id);instIds.set(i.id,i);return {id:i.id,number:i.number,amount:i.amount,due:i.due};});
  const amounts=new Map();const payments=o.payments.map(p=>{if(!p||!validId(p.id)||ids.has(p.id)||!instIds.has(p.installmentId)||!safeAmount(p.amount)||!validISO(p.date)||typeof p.note!=='string'||p.note.length>250||(p.reversedAt!==undefined&&!validISO(p.reversedAt)))throw Error('یکی از تراکنش‌های فایل معتبر نیست.');ids.add(p.id);if(!p.reversedAt)amounts.set(p.installmentId,(amounts.get(p.installmentId)||0)+p.amount);return {id:p.id,installmentId:p.installmentId,amount:p.amount,date:p.date,note:p.note,...(p.reversedAt?{reversedAt:p.reversedAt,reverseReason:typeof p.reverseReason==='string'?p.reverseReason.slice(0,200):''}:{})};});
  for(const i of installments)if((amounts.get(i.id)||0)>i.amount)throw Error('مجموع پرداخت‌ها از مبلغ یک قسط بیشتر است.');
  let changes=[];if(o.changes!==undefined){if(!Array.isArray(o.changes)||o.changes.length>1000)throw Error('تعداد سوابق اصلاحات نامعتبر است.');changes=o.changes.map(c=>{if(!c||!validId(c.id)||!validISO(c.date)||typeof c.summary!=='string'||c.summary.length>200)throw Error('سوابق اصلاحات فایل نامعتبر هستند.');return {id:c.id,date:c.date,summary:c.summary,...(c.before&&typeof c.before==='object'?{before:c.before}:{}),...(c.after&&typeof c.after==='object'?{after:c.after}:{})};});}
  return {id:o.id,type:o.type,title:o.title,party:o.party,mode:o.mode,principal:o.principal,rate:o.rate,createdAt:o.createdAt,installments,payments,changes,...(typeof o.providerId==='string'&&providerById(o.providerId)?{providerId:o.providerId}:{}),...(o.type==='loan'&&['interest','qard'].includes(o.loanKind)?{loanKind:o.loanKind}:{})};
 });

}

/* Phase 3.0: account-aware snapshot synchronization, optimistic locking, safe opt-in migration. */
const CLOUD_CONFIG=window.GHESTYAR_SUPABASE||{};
const cloud={client:null,user:null,phase:'local',revision:0,dirty:false,writing:false,accountOpen:false,error:'',authMode:'login',activationId:null,recovery:false};
let cloudCacheFingerprint=null; // Last cache this tab read or wrote; guards against stale-tab overwrites.
function cloudCacheKey(){return 'ghestyar_cloud_cache_'+cloud.user.id;}
function cloudStatusText(){return ({local:'فقط روی دستگاه',disabled:'نیاز به راه‌اندازی',loading:'در حال دریافت',choose:'انتخاب اطلاعات اولیه',ready:'همگام‌سازی‌شده',pending:'در انتظار ارسال',error:'خطای اتصال؛ قابل تکرار',conflict:'تعارض دو دستگاه'})[cloud.phase]||cloud.phase;}
function cloudConfigReady(){return /^https:\/\/[\w-]+\.supabase\.co\/?$/.test(CLOUD_CONFIG.url||'')&&!String(CLOUD_CONFIG.url).includes('YOUR-')&&typeof CLOUD_CONFIG.publishableKey==='string'&&!CLOUD_CONFIG.publishableKey.includes('YOUR_')&&CLOUD_CONFIG.publishableKey.length>24;}
function cloudSnapshot(){return {version:1,obligations:data};}
function readCloudCache(){try{const raw=localStorage.getItem(cloudCacheKey());cloudCacheFingerprint=raw;return raw?JSON.parse(raw):null;}catch(e){return null;}}
function cloudCacheChanged(){
 if(!cloud.user)return false;
 try{return localStorage.getItem(cloudCacheKey())!==cloudCacheFingerprint;}
 catch(_e){return false;}
}
function showCacheConflict(){
 cloud.phase='conflict';cloud.error='داده‌های این حساب در برگه دیگری از مرورگر تغییر کرده‌اند. برای جلوگیری از بازنویسی، ثبت این برگه متوقف شد. ابتدا پشتیبان بگیر و نسخه سرور را بررسی کن.';
 // Do not destroy unsaved input fields while informing the user about the conflict.
 if(hasUnfinishedEntry()){cloud.accountOpen=false;toast('تغییر هم‌زمان شناسایی شد. اطلاعات فرم فعلی باقی است؛ ابتدا آن را یادداشت کن و تعارض حساب را بررسی کن.','error');return;}
 cloud.accountOpen=true;toast('تغییر هم‌زمان در برگه دیگر شناسایی شد؛ اطلاعات بازنویسی نشد.','error');render();
}
function persistCloudCache(dirty=false){try{
 const raw=JSON.stringify({baseRevision:cloud.revision,dirty,obligations:data});
 localStorage.setItem(cloudCacheKey(),raw);cloudCacheFingerprint=raw;return true;
 }catch(e){toast('ذخیره نسخه بازیابی این دستگاه ممکن نشد.','error');return false;}}
function hasUnfinishedEntry(){return Boolean(state.payment||state.edit||state.settleTarget||state.deleteTarget||(state.page==='add'&&state.draft));}
function setCloudPhase(phase,msg=''){cloud.phase=phase;cloud.error=msg;render();}

async function cloudActivate(user){
 if(!user?.id)return;
 if(cloud.user?.id===user.id&&['loading','ready','pending','choose','conflict'].includes(cloud.phase))return;
 cloud.user=user;cloud.revision=0;cloud.dirty=false;cloudCacheFingerprint=null;cloud.activationId=user.id;cloud.accountOpen=cloud.recovery;
 setCloudPhase('loading');
 try{
  const {data:row,error}=await cloud.client.from('ghestyar_wallets').select('revision,payload').eq('user_id',user.id).maybeSingle();
  if(error)throw error;if(cloud.user?.id!==user.id)return;
  const saved=readCloudCache();
  if(!row){
   cloud.revision=0;
   // Recover unsent first-write data if the first upload failed, rather than asking to start over.
   if(saved?.dirty){
    try{
     const pending=validateBackup({version:1,obligations:saved.obligations});
     data=pending;cloud.dirty=true;
     if(saved.baseRevision===0){cloud.phase='pending';render();queueMicrotask(pushCloud);return;}
     cloud.phase='conflict';cloud.accountOpen=true;render();return;
    }catch(e){cloud.phase='conflict';cloud.accountOpen=true;render();return;}
   }
   // A new cloud account begins blank. Guest records remain separately in KEY for opt-in import.
   data=[];setCloudPhase('choose');cloud.accountOpen=true;render();return;
  }
  if(!Number.isSafeInteger(row.revision)||row.revision<1)throw Error('شماره نسخه پرونده ابری معتبر نیست.');
  const loaded=validateBackup(row.payload);cloud.revision=row.revision;
  if(saved?.dirty){
    try{const pending=validateBackup({version:1,obligations:saved.obligations});
      data=pending;cloud.dirty=true;
      if(saved.baseRevision===row.revision){cloud.phase='pending';render();queueMicrotask(pushCloud);return;}
      cloud.phase='conflict';cloud.accountOpen=true;render();return;
    }catch(e){cloud.phase='conflict';cloud.accountOpen=true;render();return;}
  }
  data=loaded;cloud.dirty=false;persistCloudCache(false);setCloudPhase('ready');
  pushState.loaded=false;pushState.active=false;queueMicrotask(refreshBackgroundPushState);
 }catch(e){if(cloud.user?.id!==user.id)return;cloud.accountOpen=true;setCloudPhase('error','بارگذاری پرونده ابری ناموفق بود: '+e.message);}
}
async function pushCloud(){
 if(!cloud.user||cloud.writing||!cloud.dirty||!['ready','pending','error'].includes(cloud.phase))return;
 if(!cloud.client)return;
 cloud.writing=true;cloud.phase='pending';render();
 const snapshot=cloudSnapshot();const revision=cloud.revision;const uid=cloud.user.id;
 try{
  const {data:newRevision,error}=await cloud.client.rpc('save_ghestyar_wallet',{expected_revision:revision,incoming_payload:snapshot});
  if(error)throw error;
  if(cloud.user?.id!==uid)return;
  if(!Number.isSafeInteger(Number(newRevision))||Number(newRevision)<=revision)throw Error('پاسخ سرور شماره نسخه معتبر ندارد.');
  cloud.revision=Number(newRevision);
  // Another tab may have changed its pending snapshot while this request was in flight.
  if(cloudCacheChanged()){cloud.dirty=true;showCacheConflict();return;}
  const changed=JSON.stringify(cloudSnapshot())!==JSON.stringify(snapshot);
  cloud.dirty=changed;
  persistCloudCache(changed);
  cloud.phase=changed?'pending':'ready';render();
 }catch(e){if(cloud.user?.id!==uid)return;
  const conflict=/SYNC_CONFLICT|409|23505/.test((e.message||'')+' '+(e.code||''));
  cloud.phase=conflict?'conflict':'error';cloud.error=conflict?'پرونده در دستگاه دیگری تغییر کرده است. داده‌های محلی حفظ شده‌اند؛ ابتدا پشتیبان بگیر.':e.message||'خطای اتصال';
  if(conflict)cloud.accountOpen=true;
  render();
 }finally{cloud.writing=false;if(cloud.user?.id===uid&&cloud.dirty&&cloud.phase==='pending')queueMicrotask(pushCloud);}
}
async function cloudCheckUpdates(){
 if(!cloud.user||cloud.dirty||cloud.writing||cloud.phase!=='ready'||document.hidden||hasUnfinishedEntry())return;
 try{const uid=cloud.user.id;const {data:row,error}=await cloud.client.from('ghestyar_wallets').select('revision,payload').eq('user_id',uid).maybeSingle();
  if(error)throw error;if(!row||cloud.user?.id!==uid||cloud.dirty||hasUnfinishedEntry())return;
  if(cloudCacheChanged()){showCacheConflict();return;}
  if(row.revision>cloud.revision){const next=validateBackup(row.payload);data=next;cloud.revision=row.revision;persistCloudCache(false);state.edit=null;state.payment=null;render();toast('آخرین تغییرات دستگاه دیگر دریافت شد.');}
 }catch(e){console.warn('Cloud refresh skipped:',e.message);}
}

async function initCloud(){
 if(!cloudConfigReady()){cloud.phase='disabled';render();return;}
 if(!window.supabase?.createClient){cloud.phase='error';cloud.error='کتابخانه Supabase بارگذاری نشد؛ اتصال اینترنت را بررسی کن.';render();return;}
 cloud.client=window.supabase.createClient(CLOUD_CONFIG.url,CLOUD_CONFIG.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true},db:{schema:'public'}});
 cloud.client.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY'){cloud.recovery=true;cloud.accountOpen=true;render();}
  if(event==='SIGNED_OUT'){
   const previous=cloud.user?.id;cloud.user=null;cloud.revision=0;cloud.dirty=false;cloudCacheFingerprint=null;cloud.phase='local';cloud.accountOpen=false;cloud.error='';cloud.activationId=null;cloud.recovery=false;localReload();state.payment=null;state.edit=null;state.draft=null;render();
   if(previous)toast('از حساب خارج شدی؛ اطلاعات محلی مستقل نمایش داده می‌شوند.');
  }else if(event==='SIGNED_IN'&&session?.user){queueMicrotask(()=>cloudActivate(session.user));}
 });
 try{const {data:authData,error}=await cloud.client.auth.getUser();if(error&&error.status!==400)console.warn('Auth check:',error.message);if(authData?.user)await cloudActivate(authData.user);else{cloud.phase='local';render();}}
 catch(e){cloud.phase='error';cloud.error=e.message;render();}
}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;
 if(action==='account-close'){if(el.classList.contains('modal-backdrop')&&e.target.closest('.modal'))return;cloud.accountOpen=false;render();}
 else if(action==='account-open'){cloud.accountOpen=true;render();}
 else if(['cloud-login','cloud-register','cloud-logout','cloud-reset-request','cloud-reset-update'].includes(action))cloudAuthAction(action);
 else if(action==='cloud-start-empty'||action==='cloud-import-local')cloudChoose(action==='cloud-import-local');
 else if(action==='cloud-retry'){if(cloud.dirty)pushCloud();else if(cloud.user)cloudActivate(cloud.user);}
 else if(action==='cloud-reload')cloudReloadServer();
 else if(action==='cloud-check')cloudCheckUpdates();
});
window.addEventListener('online',()=>{if(cloud.dirty)pushCloud();else cloudCheckUpdates();});
window.addEventListener('focus',()=>{refreshCurrentDay();if(cloud.dirty)pushCloud();else cloudCheckUpdates();});
setInterval(()=>{if(document.hidden)return;if(cloud.dirty&&cloud.phase==='error')pushCloud();else cloudCheckUpdates();},45000);
window.addEventListener('DOMContentLoaded',initCloud);

function confirmDeleteObligation(){

 if(!o){state.deleteTarget=null;render();toast('تعهد دیگر در فهرست وجود ندارد.','error');return;}
 if(cloud.user&&(cloud.phase!=='ready'||cloud.dirty||cloud.writing)){

 }

 }
 if(!safetyCheckpoint('پیش از حذف تعهد: '+o.title,{deletedObId:o.id}))return;

 state.deleteTarget=null;

const SAFETY_CHECKPOINT_PREFIX='ghestyar_emergency_v41_';

 }catch(_e){return [];}
}
function safetyCheckpoint(label,metadata={}){

  const verified=validateBackup({version:1,obligations:data});
  const existing=safetyCheckpoints();
  const all=[...existing,{createdAt:new Date().toISOString(),label,obligations:verified,...metadata}].slice(-3);
  const serialized=JSON.stringify(all);
  localStorage.setItem(safetyCheckpointKey(),serialized);
  if(localStorage.getItem(safetyCheckpointKey())!==serialized)throw Error('ذخیره قابل تأیید نیست');
  return true;
 }catch(e){
  toast('نسخه اضطراری در گوشی ذخیره نشد؛ برای جلوگیری از حذف اطلاعات، عملیات متوقف شد. ابتدا فایل پشتیبان JSON بگیر.','error');

<div id="gh-install-root" hidden></div>

<script>
/* PWA installation UX — does not read/write financial records or cloud storage. */
(function () {
  'use strict';
  const root = document.getElementById('gh-install-root');
  const key = 'ghestyar_install_offer_dismissed_v391';
  const cooldown = 21 * 24 * 60 * 60 * 1000;
  const ua = navigator.userAgent || '';
  const ios = /iPad|iPhone|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const android = /Android/i.test(ua);
  const mobile = ios || android;
  const safari = ios && /Safari/i.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/i.test(ua);
  let shown = false, autoEligible = false, installedFlag = false;
  let priorFocus = null, priorOverflow = '';

  const installed = () => installedFlag || !!navigator.standalone ||
    window.matchMedia('(display-mode: standalone)').matches ||
    window.matchMedia('(display-mode: fullscreen)').matches ||
    document.referrer.startsWith('android-app://');
  function postponed() {
    try { return Date.now() - Number(localStorage.getItem(key) || 0) < cooldown; }
    catch (_) { return false; }
  }
  function postpone() {
    try { localStorage.setItem(key, String(Date.now())); } catch (_) {}
  }
  function mode() {
    if (window.__ghestyarDeferredInstall) return 'native';
    if (ios) return safari ? 'ios' : 'ios-alt';
    return 'android-manual';
  }
  function stepsFor(current) {
    if (current === 'ios-alt') return [
      'آدرس همین سایت را در Safari باز کن؛ روی آیفون نصب مستقیم از این مرورگر انجام نمی‌شود.',
      'در Safari دکمه «اشتراک‌گذاری» یا «… ← Share» را بزن.',
      'گزینه «افزودن به صفحه اصلی» و سپس «افزودن» را انتخاب کن.'
    ];
    if (current === 'ios') return [
      'در Safari روی آیکون اشتراک‌گذاری یا «… ← Share» بزن.',
      'گزینه «افزودن به صفحه اصلی» (Add to Home Screen) را انتخاب کن.',
      'گزینه «باز کردن به‌صورت وب‌اپ» را فعال کن و روی «افزودن» بزن.'
    ];
    return [
      'منوی مرورگر (سه‌نقطه ⋮ یا منوی پایین مرورگر) را باز کن.',
      'گزینه «نصب برنامه» یا «افزودن به صفحه اصلی» را انتخاب کن.',
      'در پنجره تأیید روی «نصب» یا «افزودن» بزن.'
    ];
  }
  function renderSheet(manualMode) {
    const current = manualMode || mode();
    const direct = current === 'native';
    const guided = !direct;
    root.innerHTML = `<div class="gh-install-dim" data-gh-install-dismiss></div>
      <section class="gh-install-sheet" role="dialog" aria-modal="true" aria-labelledby="gh-install-title" aria-describedby="gh-install-description" dir="rtl" tabindex="-1">
        <button type="button" class="gh-install-close" data-gh-install-dismiss aria-label="بستن پنجره نصب">×</button>
        <div class="gh-install-brand"><span class="gh-install-mark" aria-hidden="true"><img src="./logo.svg" alt="" /></span>
          <div><strong id="gh-install-title">نصب قسط‌یار</strong><span>سریع، بدون فروشگاه برنامه</span></div></div>
        <p class="gh-install-caption" id="gh-install-description">قسط‌یار را به صفحه اصلی گوشی اضافه کن تا مستقیم و بدون نوار مرورگر وارد مدیریت اقساط شوی.</p>
        ${guided ? `<ol class="gh-install-steps">${stepsFor(current).map(s=>`<li>${s}</li>`).join('')}</ol>` :
          `<div class="gh-install-features"><div class="gh-install-feature"><span>✓</span>دسترسی سریع از صفحه اصلی</div><div class="gh-install-feature"><span>✓</span>نمایش تمام‌صفحه و روان</div></div>`}
        <button type="button" class="gh-install-primary" data-gh-install-primary>${direct ? 'نصب برنامه روی گوشی' : 'متوجه شدم'}</button>
        <button type="button" class="gh-install-secondary" data-gh-install-dismiss>فعلاً نه</button>
        <p class="gh-install-note">اطلاعات مالی و حساب ابری‌ات تغییر نمی‌کنند. برای همگام‌سازی و اعلان‌های آنلاین، اینترنت لازم است.</p>
      </section>`;
  }
  function close(remember = true) {
    if (!shown) return;
    if (remember) postpone();
    shown = false;
    root.hidden = true;
    root.innerHTML = '';
    document.body.style.overflow = priorOverflow;
    if (priorFocus && priorFocus.isConnected) priorFocus.focus({preventScroll:true});
  }
  function show(manual = false) {
    if (!mobile || installed() || shown) return false;
    if (!manual && (postponed() || !autoEligible)) return false;
    if (!manual && (document.hidden || (typeof state !== 'undefined' &&
      (state.page !== 'dashboard' || state.payment || state.edit || state.draft ||
       state.providerOpen || state.datePicker || (typeof cloud !== 'undefined' && cloud.accountOpen))))) return false;
    if (!manual && document.querySelector('.modal-backdrop, .picker-backdrop')) return false;
    priorFocus = document.activeElement;
    priorOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    shown = true;
    root.hidden = false;
    renderSheet();
    root.querySelector('.gh-install-sheet')?.focus({preventScroll:true});
    return true;
  }
  root.addEventListener('click', async e => {
    if (e.target.closest('[data-gh-install-dismiss]')) { close(); return; }
    if (!e.target.closest('[data-gh-install-primary]')) return;
    const event = window.__ghestyarDeferredInstall;
    if (!event) { close(); return; }
    window.__ghestyarDeferredInstall = null;
    // Must be called from this direct click gesture; do not await before prompt().
    try {
      const choicePromise = event.prompt();
      const choice = await (event.userChoice || choicePromise);
      if (choice?.outcome === 'accepted') { close(); return; }
    } catch (error) {
      console.warn('PWA install not available:', error);
      renderSheet('android-manual');
      return;
    }
    close();
  });
  document.addEventListener('click', e => {
    if (e.target.closest('[data-gh-install-open]')) {
      e.preventDefault();
      show(true);
    }
  });
  document.addEventListener('keydown', e => {
    if (!shown) return;
    if (e.key === 'Escape') { e.preventDefault(); close(); }
    if (e.key === 'Tab') {
      const focusables = Array.from(root.querySelectorAll('button:not([disabled])'));
      const first = focusables[0], last = focusables[focusables.length-1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault();last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault();first.focus(); }
    }
  });
  window.addEventListener('appinstalled', () => {
    installedFlag = true;
    window.__ghestyarDeferredInstall = null;
    close(false);
  });
  window.addEventListener('ghestyar-install-available', () => {
    if (shown) { renderSheet(); }
    else if (autoEligible) show();
  });
  // Register the existing push-only worker early. It does not cache financial records
  // and does not request notification permission by itself.
  if ('serviceWorker' in navigator && window.isSecureContext) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./reminder-sw.js', {scope:'./'})
        .catch(error => console.warn('Ghestyar service worker registration:', error));
    }, {once:true});
  }
  if (mobile && !installed()) {
    setTimeout(() => { autoEligible = true; show(); }, 9000);
    // If the first offer was deferred because a form was open, retry only on dashboard.
    let tries = 0;
    const handle = setInterval(() => {
      tries++;
      if (shown || installed() || postponed() || tries > 50) { clearInterval(handle); return; }
      show();
    }, 3000);
  }
})();
