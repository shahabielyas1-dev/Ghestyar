<script>
/* Set the theme before rendering to avoid a bright flash on dark devices. */
(function(){
  var preference = null;
  try { preference = localStorage.getItem('ghestyar_theme_v1'); } catch(e) {}
  var dark = preference === 'dark' || (preference !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0f1220' : '#f7f8fd');
})();
</script>

/* Ghestyar 2.2 — screenshot-driven mobile UX repairs */
.weekday-short{display:none}
/* The lists use their own dense, mobile-friendly toolbar. */
.obligations-page{min-width:0}
.ob-list-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 17px}
.ob-list-heading{min-width:0}
.ob-list-heading h2{font-size:20px;line-height:1.5;font-weight:900;margin:0 0 3px}
.ob-list-heading p{font-size:13px;font-weight:600;color:var(--muted);margin:0}
.ob-add-button{flex-shrink:0;white-space:nowrap;padding:11px 16px;min-height:45px}
.ob-list-tools{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.ob-list-tools .filters{display:flex;flex-wrap:nowrap;gap:7px;margin:0;min-width:0}
.ob-list-tools .filter{min-width:0;white-space:nowrap;border-radius:12px;min-height:42px;padding:9px 13px}
.ob-list-tools .searchbox{flex:0 1 320px;width:100%;max-width:none;min-width:165px;margin:0;min-height:46px;order:1;border-radius:13px}

.ob-list-tools .searchbox input{font-size:14px;min-height:44px;outline:0}
.ob-card{padding:18px;overflow:hidden}
.ob-top{min-width:0;gap:10px}
.ob-identity{flex:1;min-width:0}
.ob-card .tag{flex-shrink:0}
.ob-card .ob-name{font-size:16px;line-height:1.5}
.ob-card .ob-party{font-size:12px;line-height:1.55;margin-top:2px}
.ob-finance{margin:16px 0 13px}
.ob-finance-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:700}
.ob-amount{display:flex;align-items:baseline;gap:7px;min-width:0;margin-top:4px;flex-wrap:wrap}
.ob-amount strong{font-size:clamp(19px,2.2vw,24px);line-height:1.6;font-weight:900;direction:ltr;unicode-bidi:isolate;white-space:nowrap;max-width:100%}

/* Calendar: eliminate full day-name collision on narrow screens. */
.weekgrid,.calgrid{width:100%;min-width:0;grid-template-columns:repeat(7,minmax(0,1fr))}
.weekgrid>span{min-width:0;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;font-weight:800}
.day{min-width:0;touch-action:manipulation}
.day:focus-visible{outline:3px solid #8d73e8;outline-offset:-2px}
.calendar-head>div:first-child{min-width:0}
.calendar-controls button{flex:0 0 auto}
@media(max-width:900px){

  .dash-v2 .dash-bottom-head,.dash-v2 .dash-small-grid{display:none}

async function pushCloud(){

async function initCloud(){
 if(!cloudConfigReady()){cloud.phase='disabled';render();return;}
 if(!window.supabase?.createClient){cloud.phase='error';cloud.error='کتابخانه Supabase بارگذاری نشد؛ اتصال اینترنت را بررسی کن.';render();return;}
 cloud.client=window.supabase.createClient(CLOUD_CONFIG.url,CLOUD_CONFIG.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true},db:{schema:'public'}});
 cloud.client.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY'){cloud.recovery=true;cloud.accountOpen=true;render();}
  if(event==='SIGNED_OUT'){
   const previous=cloud.user?.id;cloud.user=null;cloud.revision=0;cloud.dirty=false;cloud.phase='local';cloud.accountOpen=false;cloud.error='';cloud.activationId=null;cloud.recovery=false;localReload();state.payment=null;state.edit=null;state.draft=null;render();
   if(previous)toast('از حساب خارج شدی؛ اطلاعات محلی مستقل نمایش داده می‌شوند.');
  }else if(event==='SIGNED_IN'&&session?.user){queueMicrotask(()=>cloudActivate(session.user));}
 });
 try{const {data:authData,error}=await cloud.client.auth.getUser();if(error&&error.status!==400)console.warn('Auth check:',error.message);if(authData?.user)await cloudActivate(authData.user);else{cloud.phase='local';render();}}
 catch(e){cloud.phase='error';cloud.error=e.message;render();}
}
document.addEventListener('click',e=>{

 if(action==='account-close'){if(el.classList.contains('modal-backdrop')&&e.target.closest('.modal'))return;cloud.accountOpen=false;render();}
 else if(action==='account-open'){cloud.accountOpen=true;render();}
 else if(['cloud-login','cloud-register','cloud-logout','cloud-reset-request','cloud-reset-update'].includes(action))cloudAuthAction(action);
 else if(action==='cloud-start-empty'||action==='cloud-import-local')cloudChoose(action==='cloud-import-local');
 else if(action==='cloud-retry'){if(cloud.dirty)pushCloud();else if(cloud.user)cloudActivate(cloud.user);}
 else if(action==='cloud-reload')cloudReloadServer();
 else if(action==='cloud-check')cloudCheckUpdates();
});
window.addEventListener('online',()=>{if(cloud.dirty)pushCloud();else cloudCheckUpdates();});
window.addEventListener('focus',()=>{if(cloud.dirty)pushCloud();else cloudCheckUpdates();});
setInterval(()=>{if(cloud.dirty&&cloud.phase==='error')pushCloud();else cloudCheckUpdates();},25000);
window.addEventListener('DOMContentLoaded',initCloud);

function editModal(){if(!state.edit)return '';const e=state.edit,o=data.find(x=>x.id===e.ob);if(!o)return '';let body='';if(e.kind==='ob'){body=`<div class="field"><label for="edit-title">عنوان تعهد</label><input id="edit-title" maxlength="100" value="${escapeHTML(o.title)}"/></div><div class="field"><label for="edit-party">نام بانک، فروشنده یا طرف حساب</label><input id="edit-party" maxlength="100" value="${escapeHTML(o.party)}"/></div><p class="muted small">مشخصات قابل تغییرند؛ اقساط و پرداخت‌ها حفظ می‌شوند.</p>`;}else{const i=o.installments.find(x=>x.id===e.inst);if(!i)return '';body=`<p class="muted">قسط ${fnum(i.number)} از ${escapeHTML(o.title)}</p><div class="field"><label for="edit-amount">مبلغ قسط (تومان)</label><input id="edit-amount" inputmode="numeric" value="${i.amount}"/></div><div class="field"><label for="edit-due">سررسید شمسی</label><input id="edit-due" value="${jText(i.due,true)}"/></div><p class="muted small">مبلغ جدید نباید از پرداخت‌های ثبت‌شده این قسط کمتر باشد. قسط کاملاً تسویه‌شده قابل ویرایش نیست.</p>`;}

async function importBackup(file){if(!file)return;if(file.size>4*1024*1024){toast('حجم فایل بیشتر از ۴ مگابایت است.','error');return;}try{const content=await file.text();const loaded=validateBackup(JSON.parse(content));const count=loaded.reduce((sum,o)=>sum+o.installments.length,0);if(!window.confirm(`فایل بررسی شد: ${loaded.length} تعهد و ${count} قسط.\nاطلاعات فعلی (${data.length} تعهد) به‌طور کامل جایگزین می‌شوند.\nپیش از ادامه از داده‌های فعلی پشتیبان گرفته‌ای؟`))return;if(!commit(loaded))return;state.draft=null;state.payment=null;state.edit=null;nav('dashboard');toast('پشتیبان بازیابی شد.');}catch(e){toast('بازیابی انجام نشد: '+e.message,'error');}}
function reversePayment(obId,paymentId){const o=data.find(x=>x.id===obId),p=o?.payments.find(x=>x.id===paymentId);if(!p||p.reversedAt)return;const reason=window.prompt('دلیل ابطال ثبت پرداخت را وارد کن (مثلاً مبلغ اشتباه):','ثبت اشتباه');if(reason===null)return;if(!reason.trim()||reason.length>200){toast('دلیل ابطال را وارد کن (حداکثر ۲۰۰ نویسه).','error');return;}if(!window.confirm(`پرداخت ${fmt(p.amount)} تومانی باطل شود؟\nسوابق حذف نمی‌شوند و مبلغ به مانده قسط برمی‌گردد.`))return;const next=data.map(x=>x.id===obId?{...x,payments:x.payments.map(y=>y.id===paymentId?{...y,reversedAt:todayISO,reverseReason:reason.trim()}:y)}:x);if(!commit(next))return;render();toast('پرداخت باطل شد؛ مانده قسط اصلاح شد.');}

function render(){let content='';if(state.page==='dashboard')content=dashboard();else if(state.page==='obligations')content=obligations();else if(state.page==='add')content=wizard();else if(state.page==='detail')content=detail();else if(state.page==='calendar')content=calendar();else if(state.page==='settings')content=settingsPage();$('#app').innerHTML=sidebar()+`<main class="main">${header()}${content}</main>`+bottomNav()+payModal()+editModal()+accountModal();document.title=`قسط‌یار | ${{dashboard:'داشبورد',obligations:'تعهدات من',add:'ثبت تعهد',detail:'جزئیات اقساط',calendar:'تقویم شمسی',settings:'مدیریت داده‌ها'}[state.page]}`;}

function calendarShift(delta){const {y,m}=state.calendarMonth;const idx=y*12+m-1+delta;state.calendarMonth={y:Math.floor(idx/12),m:(idx%12+12)%12+1};const date=jISO(state.calendarMonth.y,state.calendarMonth.m,1);state.selectedDay=date||todayISO;render();}

  return;
 }
 if(action==='reverse-payment'){reversePayment(btn.dataset.ob,btn.dataset.payment);return;}
 if(action==='edit-ob'){state.edit={kind:'ob',ob:btn.dataset.ob};render();document.getElementById('edit-title')?.focus();return;}
 if(action==='edit-inst'){state.edit={kind:'inst',ob:btn.dataset.ob,inst:btn.dataset.inst};render();document.getElementById('edit-amount')?.focus();return;}
 if(action==='close-edit'){if(btn.classList.contains('modal-backdrop')&&e.target.closest('.modal'))return;state.edit=null;render();return;}
 if(action==='edit-save'){
  const edit=state.edit,o=data.find(x=>x.id===edit?.ob);if(!o)return;
  let next;
  if(edit.kind==='ob'){const title=$('#edit-title').value.trim(),party=$('#edit-party').value.trim();if(title.length<2||title.length>100||party.length>100){toast('عنوان باید بین ۲ تا ۱۰۰ نویسه باشد.','error');return;}next=data.map(x=>x.id===o.id?{...x,title,party,changes:[...(x.changes||[]),{id:id(),date:todayISO,summary:'ویرایش عنوان یا طرف حساب',before:{title:x.title,party:x.party},after:{title,party}}]}:x);}
  else {const i=o.installments.find(x=>x.id===edit.inst),amount=number($('#edit-amount').value),due=jParse($('#edit-due').value);if(!i||left(o,i)<=0||!Number.isSafeInteger(amount)||amount<paid(o,i)||amount<1||amount>1e12||!due){toast('مبلغ یا تاریخ معتبر نیست یا مبلغ از پرداخت قبلی کمتر است.','error');return;}if(!window.confirm('مبلغ یا تاریخ سررسید قسط ویرایش شود؟ این تغییر بر گزارش‌های آینده تأثیر می‌گذارد.'))return;next=data.map(x=>x.id===o.id?{...x,installments:x.installments.map(y=>y.id===i.id?{...y,amount,due}:y),changes:[...(x.changes||[]),{id:id(),date:todayISO,summary:`اصلاح مبلغ یا سررسید قسط ${fnum(i.number)}`,before:{amount:i.amount,due:i.due},after:{amount,due}}]}:x);}
  if(!commit(next))return;state.edit=null;render();toast('تغییرات با موفقیت ثبت شدند.');
 }
});
document.addEventListener('change',e=>{if(e.target.id==='backup-file'){const file=e.target.files?.[0];e.target.value='';importBackup(file);}});

document.addEventListener('click',e=>{const type=e.target.closest('[data-draft-type]');if(type){state.draft.type=type.dataset.draftType;state.draft.rows=[];render();}const mode=e.target.closest('[data-draft-mode]');if(mode){state.draft.mode=mode.dataset.draftMode;state.draft.rows=[];render();}const tab=e.target.closest('[data-tab]');if(tab){state.detailTab=tab.dataset.tab;render();}});
document.addEventListener('change',e=>{if(e.target.dataset.draft){state.draft[e.target.dataset.draft]=e.target.value;state.draft.rows=[];render();}if(e.target.dataset.row!==undefined){const idx=+e.target.dataset.row,prop=e.target.dataset.prop;if(prop==='amount'){const value=number(e.target.value);state.draft.rows[idx].amount=value;}else if(prop==='due'){state.draft.rows[idx].due=jParse(e.target.value);}if(state.draft.rows[idx].due===null)toast('تاریخ شمسی این ردیف معتبر نیست.','error');}});
document.addEventListener('input',e=>{if(e.target.id==='ob-search'){const pos=e.target.selectionStart;state.query=e.target.value;const holder=$('.ob-grid')||$('.empty');const matches=data.filter(o=>{const st=obligationStatus(o);return (state.filter==='all'||(state.filter==='active'?st!=='paid':st===state.filter))&&(`${o.title} ${o.party}`.toLowerCase().includes(state.query.toLowerCase()));});if(holder)holder.outerHTML=matches.length?`<div class="ob-grid">${matches.map(obCard).join('')}</div>`:`<div class="panel empty">نتیجه‌ای پیدا نشد.</div>`;}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(state.payment||state.edit)){state.payment=null;state.edit=null;render();}if(e.key==='Enter'&&e.target.matches('[data-action="view"]')){state.selectedId=e.target.dataset.ob;state.detailTab='schedule';state.scheduleFilter='open';nav('detail');}});
render();if(storageRecoveryNeeded)toast('فایل اطلاعات قبلی قابل خواندن نیست؛ برای جلوگیری از حذف، بازنویسی نشده است. ابتدا از داده مرورگر نسخه پشتیبان تهیه کن.','error');
</script>
</body>
</html>
